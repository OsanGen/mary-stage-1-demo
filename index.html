<title>Mary Stage 1</title>
<style>
:root { --ink:#111; --white:#fff; --fog:#eef0ee; --fog2:#dfe2df; --muted:#5d615e;
  --mint:#dff3e4; --mint-ink:#246444; --red:#f8e0dc; --red-ink:#8c3028; --blue-ink:#1f6e83;
  --ease:cubic-bezier(.23,1,.32,1); }
* { box-sizing:border-box; }
html,body { margin:0; padding:0; }
body { min-height:100dvh; display:grid; place-items:center; background:var(--fog); color:var(--ink);
  font:16px/1.5 Inter,system-ui,sans-serif; padding:20px; }
.gate { position:relative; width:min(430px,100%); border:1.5px solid var(--ink); border-radius:22px;
  background:var(--white); box-shadow:0 12px 28px rgba(17,17,17,.08); padding:38px 36px 32px;
  animation:arrive .5s var(--ease) both; }
@keyframes arrive { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
.gate.is-denied { animation:shake .4s var(--ease); }
@keyframes shake { 0%,100% { transform:translateX(0); } 20% { transform:translateX(-9px); }
  45% { transform:translateX(7px); } 70% { transform:translateX(-4px); } 88% { transform:translateX(2px); } }
.seal { display:flex; align-items:center; gap:11px; margin-bottom:24px; }
.seal i { position:relative; width:34px; height:34px; border:2.5px solid var(--ink); border-radius:50%; }
.seal i::before { content:""; position:absolute; left:50%; top:9px; bottom:9px; width:2px;
  transform:translateX(-50%); background:var(--blue-ink); }
.seal i::after { content:""; position:absolute; left:50%; bottom:8px; width:8px; height:8px;
  transform:translateX(-50%); border:2px solid var(--blue-ink); border-radius:50%; background:var(--white); }
.seal div span { display:block; font-family:Sora,Inter,sans-serif; font-size:17px; font-weight:700; letter-spacing:-.01em; }
.seal div small { font-size:9px; font-weight:700; letter-spacing:.14em; color:var(--muted); }
.kicker { margin:0 0 6px; font-size:10px; font-weight:700; letter-spacing:.1em; color:var(--blue-ink); text-transform:uppercase; }
h1 { margin:0 0 6px; font-family:Sora,Inter,sans-serif; font-size:23px; line-height:1.15; letter-spacing:-.01em; }
.sub { margin:0 0 22px; font-size:13px; line-height:1.55; color:var(--muted); }
label { display:block; margin-bottom:6px; font-size:10px; font-weight:700; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; }
.field { position:relative; margin-bottom:8px; }
input { width:100%; border:1.5px solid var(--fog2); border-radius:12px; padding:13px 88px 13px 15px;
  font:inherit; font-size:15px; color:var(--ink); background:var(--white); outline:none;
  transition:border-color .2s var(--ease), box-shadow .2s var(--ease); }
input:focus { border-color:var(--blue-ink); box-shadow:0 0 0 3px #dceff5; }
.gate.is-denied input { border-color:var(--red-ink); box-shadow:0 0 0 3px var(--red); }
.peek { position:absolute; right:9px; top:50%; transform:translateY(-50%); border:1px solid var(--fog2);
  border-radius:8px; background:var(--fog); padding:5px 10px; font:inherit; font-size:11px; font-weight:700;
  color:var(--muted); cursor:pointer; }
.hint { min-height:18px; margin:0 0 14px; font-size:11.5px; color:var(--muted); }
.hint.err { color:var(--red-ink); font-weight:600; }
button.unlock { position:relative; width:100%; border:0; border-radius:999px; padding:15px 22px; overflow:hidden;
  background:var(--ink); color:var(--white); font-family:Sora,Inter,sans-serif; font-size:15px; font-weight:700;
  cursor:pointer; transition:transform .15s var(--ease), opacity .2s; }
button.unlock:hover { transform:translateY(-1px); }
button.unlock:disabled { cursor:default; opacity:.85; }
button.unlock .shimmer { position:absolute; inset:0; display:none;
  background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.22) 50%, transparent 70%);
  background-size:220% 100%; animation:sweep 1s linear infinite; }
.gate.is-working button.unlock .shimmer { display:block; }
@keyframes sweep { from { background-position:180% 0; } to { background-position:-80% 0; } }
.foot { margin:20px 0 0; font-size:10px; font-weight:600; letter-spacing:.07em; color:var(--muted); text-transform:uppercase; text-align:center; }
.stamp { position:absolute; right:18px; top:14px; display:none; transform:rotate(-8deg);
  border:2.5px solid var(--mint-ink); border-radius:12px; padding:7px 13px; background:var(--mint);
  color:var(--mint-ink); font-family:Sora,Inter,sans-serif; font-size:12px; font-weight:700; letter-spacing:.05em; }
.gate.is-granted .stamp { display:block; animation:stamp .35s var(--ease) both; }
@keyframes stamp { from { opacity:0; transform:rotate(-8deg) scale(1.6); } to { opacity:1; transform:rotate(-8deg) scale(1); } }
.gate.is-granted form { opacity:.35; pointer-events:none; }
@media (prefers-reduced-motion: reduce) { .gate, .gate.is-denied, .stamp { animation:none !important; }
  button.unlock .shimmer { display:none !important; } }
</style>
</head>
<body>
<main class="gate" id="gate" aria-live="polite">
  <div class="stamp" aria-hidden="true">ACCESS GRANTED</div>
  <div class="seal"><i aria-hidden="true"></i><div><span>MARY&nbsp;STAGE&nbsp;1</span><small>GOVERNED&nbsp;EVIDENCE</small></div></div>
  <p class="kicker">Governed access · Private walkthrough</p>
  <h1>This walkthrough is locked.</h1>
  <p class="sub">The content is encrypted in your browser. Enter the access key you were given to unlock it.</p>
  <form id="form" autocomplete="on">
    <label for="pw">Access key</label>
    <div class="field">
      <input id="pw" name="password" type="password" autocomplete="current-password" autofocus
        aria-describedby="hint" spellcheck="false" />
      <button type="button" class="peek" id="peek" aria-label="Show access key">show</button>
    </div>
    <p class="hint" id="hint"></p>
    <button type="submit" class="unlock" id="unlock"><span class="shimmer" aria-hidden="true"></span><span id="unlock-label">Unlock the walkthrough</span></button>
  </form>
  <p class="foot">Encrypted client-side · synthetic demonstration data only</p>
</main>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const gate = document.getElementById("gate");
const form = document.getElementById("form");
const input = document.getElementById("pw");
const hint = document.getElementById("hint");
const unlock = document.getElementById("unlock");
const label = document.getElementById("unlock-label");
const peek = document.getElementById("peek");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

peek.addEventListener("click", () => {
  const show = input.type === "password";
  input.type = show ? "text" : "password";
  peek.textContent = show ? "hide" : "show";
  peek.setAttribute("aria-label", show ? "Hide access key" : "Show access key");
  input.focus();
});
input.addEventListener("keyup", (e) => {
  if (e.getModifierState && e.getModifierState("CapsLock")) { hint.classList.remove("err"); hint.textContent = "Caps Lock is on."; }
  else if (hint.textContent === "Caps Lock is on.") hint.textContent = "";
});

async function deriveKey(password) {
  const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: "SHA-256" },
    material, { name: "AES-GCM", length: 256 }, true, ["decrypt"]
  );
}
async function decryptWith(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  return new TextDecoder().decode(plain);
}
async function enterDemo(html) {
  // document.open() is a no-op while the parser is still active (fast reloads hit
  // this on the sessionStorage path), which would inject the demo INTO the gate
  // instead of replacing it. Wait for parsing to finish before writing.
  if (document.readyState === "loading") {
    await new Promise((resolve) => addEventListener("DOMContentLoaded", resolve, { once: true }));
  }
  document.open();
  document.write(html);
  document.close();
  // Module scripts written via document.write execute inconsistently across load
  // states, so the app code ships inert (text/plain) and is injected explicitly —
  // one deterministic boot path for both the submit and session-restore flows.
  for (let attempt = 0; attempt < 20; attempt++) {
    const src = document.getElementById("app-src");
    if (src) {
      const script = document.createElement("script");
      script.type = "module";
      script.textContent = src.textContent;
      src.remove();
      document.body.appendChild(script);
      return;
    }
    await new Promise((resolve) => setTimeout(resolve, 50));
  }
}

/* Same-tab refresh skips the prompt: the derived key (never the password) is kept per tab. */
(async () => {
  try {
    const stored = sessionStorage.getItem("mary.gate.key");
    if (!stored) return;
    const key = await crypto.subtle.importKey("raw", b64(stored), { name: "AES-GCM" }, true, ["decrypt"]);
    await enterDemo(await decryptWith(key));
  } catch { /* stored key stale for a new build — fall through to the form */ }
})();

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const password = input.value;
  if (!password) { hint.classList.add("err"); hint.textContent = "Enter the access key."; return; }
  gate.classList.remove("is-denied");
  gate.classList.add("is-working");
  unlock.disabled = true;
  label.textContent = "Deriving key…";
  hint.classList.remove("err");
  hint.textContent = "";
  await new Promise((r) => setTimeout(r, 30));
  try {
    const key = await deriveKey(password);
    const html = await decryptWith(key);
    try { sessionStorage.setItem("mary.gate.key", btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw", key))))); } catch {}
    gate.classList.remove("is-working");
    gate.classList.add("is-granted");
    label.textContent = "Unlocked";
    if (reduced) { enterDemo(html); return; }
    setTimeout(() => enterDemo(html), 650);
  } catch {
    gate.classList.remove("is-working");
    unlock.disabled = false;
    label.textContent = "Unlock the walkthrough";
    hint.classList.add("err");
    hint.textContent = "That's not the key. Check it and try again.";
    requestAnimationFrame(() => gate.classList.add("is-denied"));
    input.select();
  }
});
</script>
